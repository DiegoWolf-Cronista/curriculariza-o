<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jogo Brusque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


<!-- TELA INICIAL -->
<div id="inicio" class="tela ativa tela-inicio">
    <div class="conteudo-jogo inicio-conteudo">        
        <button class="botao-jogo" onclick="iniciarJogo()">Iniciar</button>
    </div>
</div>

<div id="telaVideo" class="tela-video" style="display:none;">

    <video id="videoIntro" class="video-intro">
        <source src="videos/video.mp4" type="video/mp4">
    </video>

    <button class="botao-pular" onclick="pularVideo()">
        Pular ▶
    </button>

</div>


<!-- LOGIN -->
<div id="login" class="tela tela-login">
    <div class="painel-jogo">
        <h2>Olá amiguinho!</h2>

        <input type="text" id="nome" placeholder="Seu nome">
        <input type="text" id="escola" placeholder="Sua escola">
        <input type="number" id="idade" placeholder="Sua idade">

        <button class="botao-jogo" onclick="comecar()">Entrar na aventura</button>
    </div>
</div>


<!-- PERGUNTA -->
<div id="quiz" class="tela tela-quiz">

    <div class="painel-jogo painel-quiz">

        <div class="contador-wrapper">

        </div>

        <h2 id="pergunta"></h2>

        <img id="imagemPergunta" class="img-pergunta">

        <div id="respostas"></div>

        
            <button id="botaoAudio" class="botao-audio">
            <span class="icone-audio">Áudio🔊</span>
                Ouvir
            </button>

    </div>

</div>


<!-- FEEDBACK -->
<div id="feedback" class="tela tela-feedback">
    <div class="painel-jogo">
        <h2 id="mensagem"></h2>
        <button class="botao-jogo" onclick="proximaPergunta()">Continuar</button>
    </div>
</div>


<!-- FINAL -->
<div id="final" class="tela tela-final">
    <div class="painel-jogo">
        <h2 id="resultadoFinal"></h2>
        <button class="botao-jogo" onclick="reiniciar()">Jogar novamente</button>
    </div>
</div>


<script src="script.js"></script>
</body>
</html>
